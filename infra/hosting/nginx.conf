worker_processes auto;
pid /tmp/agrimatch-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/agrimatch-body;
    proxy_temp_path /tmp/agrimatch-proxy;
    fastcgi_temp_path /tmp/agrimatch-fastcgi;
    uwsgi_temp_path /tmp/agrimatch-uwsgi;
    scgi_temp_path /tmp/agrimatch-scgi;
    client_max_body_size 6m;
    server_tokens off;
    server {
        listen 8080;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /healthz {
            proxy_pass http://127.0.0.1:4000;
        }
        location /webhooks/line/ {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_pass http://127.0.0.1:4000;
        }
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
